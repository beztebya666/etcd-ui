version: 2

project_name: etcd-ui

before:
  hooks:
    - go mod tidy

builds:
  - id: supervisor
    main: ./cmd/supervisor
    binary: supervisor
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: [-s -w -X main.Version={{.Version}}]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
  - id: gateway
    main: ./cmd/gateway
    binary: gateway
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: [-s -w -X main.Version={{.Version}}]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
  - id: cluster
    main: ./cmd/cluster
    binary: cluster
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: [-s -w -X main.Version={{.Version}}]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
  - id: kv
    main: ./cmd/kv
    binary: kv
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: [-s -w -X main.Version={{.Version}}]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
  - id: ops
    main: ./cmd/ops
    binary: ops
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: [-s -w -X main.Version={{.Version}}]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
  - id: audit
    main: ./cmd/audit
    binary: audit
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: [-s -w -X main.Version={{.Version}}]
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds_info:
      group: root
      owner: root
    files:
      - README.md
      - LICENSE*
      - CHANGELOG.md
      - docs/CONNECT.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))?:'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))?:'
      order: 1
    - title: Other
      order: 99

release:
  github:
    owner: beztebya666
    name: etcd-ui
  draft: false
  prerelease: auto
