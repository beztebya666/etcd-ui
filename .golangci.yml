# golangci-lint v2 config for etcd-ui.
#
# Goals are the same as before:
#   - catch real bugs (errcheck/govet/staticcheck/ineffassign)
#   - hold the codebase to one style (gofmt + gofumpt + gci ordering)
#   - keep CI lint runs under the 7 GB GitHub-runner ceiling — we link
#     k8s.io/api (519 Kinds across 19 groups) which expands type-check
#     RAM use considerably, so the linter set is kept tight.
#
# Schema migrated from v1 in this commit:
#   - top-level key `version: "2"` is now required
#   - `linters.enable-all/disable-all` → `linters.default + disable`
#   - `run.go` lives at `run.go` still, but the lint tool's own
#     embedded Go must be ≥ our go.mod target. v2.x is built with
#     Go 1.25, so we're aligned.
#   - `run.skip-dirs` is gone — directory excludes now go under
#     `issues.exclude-dirs` (v2 uses `exclusions.paths` in some
#     templates but `issues.exclude-dirs` is still honoured for
#     v1 → v2 migrations).

version: "2"

run:
  timeout: 8m
  go: "1.25"
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - gosec
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - noctx
    - nolintlint
    - errorlint
    - copyloopvar
  settings:
    govet:
      enable:
        - shadow
        - nilness
    staticcheck:
      # SA1*-SA6* covers correctness and dead code without the heavy
      # SA9xxx style analyses. Style is gofumpt's job; SA9xxx pushed
      # the lint pass past the 7 GB runner cap.
      checks:
        - "SA1*"
        - "SA2*"
        - "SA3*"
        - "SA4*"
        - "SA5*"
        - "SA6*"
  exclusions:
    paths:
      # testseed is a one-shot script, not production code; lint
      # rules there add noise without signal. Same for the
      # browser-screenshot recorder.
      - internal/k8sdecode/testseed
      - scripts/screenshots
    rules:
      # Tests routinely ignore resp.Body.Close / os.RemoveAll errors —
      # not actionable, and errcheck noise drowns real issues.
      - path: _test\.go
        linters:
          - errcheck
          - bodyclose
      - path: internal/audit/audit\.go
        text: "Error return value of `\\(\\*encoding/json.Encoder\\).Encode` is not checked"

formatters:
  enable:
    - gofmt
    - gofumpt
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/yourorg/etcd-ui)
