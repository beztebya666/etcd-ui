name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  go:
    name: go test + vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - run: go mod tidy
      - run: go vet ./...
      - run: go test ./... -count=1 -short -timeout 120s
      - name: race detector
        # -short skips multi-GB / multi-minute exhaustive tests (e.g.
        # storage.TestS3_PutLarge_SwitchesToMultipart streams 5 GiB
        # through a mock — minutes on a GH runner). They still run
        # locally with plain `go test ./...`.
        run: CGO_ENABLED=1 go test -race -count=1 -short -timeout 300s ./...
      - name: build all binaries
        run: |
          mkdir -p bin
          for svc in supervisor gateway cluster kv ops audit; do
            CGO_ENABLED=0 go build -ldflags='-s -w' -o bin/$svc ./cmd/$svc
          done

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    env:
      # GH free runners have 7 GB RAM. staticcheck with `checks: all`
      # across our k8s.io/api dependency graph OOM-killed the runner
      # mid-analysis. GOMEMLIMIT keeps Go's GC aggressive enough that
      # we stay under the cgroup cap; --concurrency=2 caps the parallel
      # package analysers so the resident set doesn't spike either.
      GOMEMLIMIT: "6500MiB"
      GOGC: "50"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25", cache: true }
      - uses: golangci/golangci-lint-action@v6
        with:
          # v1.61 ships an x/tools fork that can't decode Go 1.25's
          # `sync/atomic` export-data format ("unsupported version: 2"),
          # which cascaded into spurious typecheck errors. v1.64
          # rebased onto Go-1.25-aware x/tools fixes both.
          version: v1.64
          args: --timeout=8m --concurrency=2

  web:
    name: web build + vitest
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          # No cache-dependency-path: we don't commit `web/package-lock.json`
          # (it's in .gitignore — large, often-churning, and `npm install`
          # is idempotent enough for CI). setup-node@v4 raises a hard
          # error when the configured path doesn't exist, so we drop the
          # `cache` key entirely instead of half-configuring it.
      - run: npm install --legacy-peer-deps
      - run: npm run build
      - run: npm test --silent

  integration:
    name: integration tests (real etcd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25", cache: true }
      # Run etcd ourselves instead of via GH `services:` — the etcd image
      # is distroless (no shell, no busybox), so GH's --health-cmd can't
      # find `etcdctl` and the service is stuck "unhealthy" forever.
      # Spawning via plain `docker run` + explicit TCP wait is simpler
      # and faster (no 50s health-grace wait).
      - name: start etcd
        run: |
          docker run -d --name etcd-it \
            -p 2379:2379 -p 2380:2380 \
            -e ETCD_NAME=etcd \
            -e ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379 \
            -e ETCD_ADVERTISE_CLIENT_URLS=http://127.0.0.1:2379 \
            -e ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380 \
            -e ETCD_INITIAL_ADVERTISE_PEER_URLS=http://127.0.0.1:2380 \
            -e ETCD_INITIAL_CLUSTER=etcd=http://127.0.0.1:2380 \
            -e ETCD_INITIAL_CLUSTER_TOKEN=test \
            quay.io/coreos/etcd:v3.5.15
      - name: wait for etcd
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:2379/version >/dev/null; then
              echo "etcd up after $i tries"
              curl -s http://127.0.0.1:2379/version
              exit 0
            fi
            sleep 1
          done
          echo "etcd never came up" >&2
          docker logs etcd-it >&2 || true
          exit 1
      - run: go mod tidy
      - name: integration tests against real etcd
        env:
          # Tests look for `ETCD_UI_TEST_ENDPOINT`. Setting `ETCD_ENDPOINTS`
          # too keeps any legacy paths happy.
          ETCD_UI_TEST_ENDPOINT: http://127.0.0.1:2379
          ETCD_ENDPOINTS: http://127.0.0.1:2379
        run: go test ./... -count=1 -short -timeout 3m

  e2e:
    name: playwright e2e
    runs-on: ubuntu-latest
    needs: web
    # E2E requires the full backend (gateway + 4 internal services) to be
    # up and pointed at a real etcd. The vite dev server alone can't
    # answer /api/* — proxy ECONNREFUSED. Gate this on manual dispatch
    # until we have a docker-compose harness that boots the whole stack.
    if: github.event_name == 'workflow_dispatch'
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  docker:
    name: docker image (multi-arch)
    runs-on: ubuntu-latest
    needs: [go, web]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: SBOM (syft)
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          artifact-name: sbom.spdx.json
      - name: Vulnerability scan (grype)
        uses: anchore/scan-action@v3
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          fail-build: false
          severity-cutoff: high

  release:
    name: release (goreleaser)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: "1.25", cache: true }
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
