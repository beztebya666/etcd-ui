name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: go test + vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - run: go mod tidy
      - run: go vet ./...
      - run: go test ./... -count=1 -timeout 90s
      - name: race detector
        run: CGO_ENABLED=1 go test -race -count=1 -timeout 180s ./...
      - name: build all binaries
        run: |
          mkdir -p bin
          for svc in supervisor gateway cluster kv ops audit; do
            CGO_ENABLED=0 go build -ldflags='-s -w' -o bin/$svc ./cmd/$svc
          done

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25", cache: true }
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61
          args: --timeout=5m

  web:
    name: web build + vitest
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install --legacy-peer-deps
      - run: npm run build
      - run: npm test --silent

  integration:
    name: integration tests (real etcd)
    runs-on: ubuntu-latest
    services:
      etcd:
        image: quay.io/coreos/etcd:v3.5.15
        ports: ["2379:2379", "2380:2380"]
        options: >-
          -e ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
          -e ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
          -e ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
          -e ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd:2380
          -e ETCD_INITIAL_CLUSTER=etcd=http://etcd:2380
          -e ETCD_INITIAL_CLUSTER_TOKEN=test
          --health-cmd "etcdctl endpoint health"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25", cache: true }
      - run: go mod tidy
      - run: ETCD_ENDPOINTS=http://localhost:2379 go test -tags=integration ./... -count=1 -timeout 2m

  e2e:
    name: playwright e2e
    runs-on: ubuntu-latest
    needs: web
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  docker:
    name: docker image (multi-arch)
    runs-on: ubuntu-latest
    needs: [go, web]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: SBOM (syft)
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          artifact-name: sbom.spdx.json
      - name: Vulnerability scan (grype)
        uses: anchore/scan-action@v3
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          fail-build: false
          severity-cutoff: high

  release:
    name: release (goreleaser)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: "1.25", cache: true }
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
