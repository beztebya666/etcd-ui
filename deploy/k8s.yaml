---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: etcd-ui
  namespace: kube-system
---
# Read pod info in kube-system so the kubernetes discovery source can find etcd.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: etcd-ui-read-pods
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: etcd-ui-read-pods
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: etcd-ui-read-pods
subjects:
  - kind: ServiceAccount
    name: etcd-ui
    namespace: kube-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: etcd-ui
  namespace: kube-system
  labels: { app: etcd-ui }
spec:
  replicas: 1
  selector:
    matchLabels: { app: etcd-ui }
  template:
    metadata:
      labels: { app: etcd-ui }
    spec:
      serviceAccountName: etcd-ui
      containers:
        - name: etcd-ui
          image: ghcr.io/yourorg/etcd-ui:latest
          ports:
            - containerPort: 8080
          env:
            # mount the kube-apiserver-issued etcd client certs at /certs to use mTLS.
            - { name: ETCD_CA_FILE, value: /certs/ca.crt }
            - { name: ETCD_CERT_FILE, value: /certs/client.crt }
            - { name: ETCD_KEY_FILE, value: /certs/client.key }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: etcd-ui
  namespace: kube-system
spec:
  type: ClusterIP
  selector: { app: etcd-ui }
  ports:
    - port: 80
      targetPort: 8080
