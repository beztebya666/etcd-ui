# golangci-lint v2 config for etcd-ui.
#
# Linter philosophy: only enable checks that catch REAL BUGS, not style.
# We have a pre-existing backlog of errcheck-on-Close warnings (cleanup
# paths where the error is genuinely irrecoverable) and gci formatting
# nags — both produce zero correctness signal. We let gofumpt + a
# pre-commit hook handle formatting; CI's job is to block bugs.
#
# What stays enabled:
#   * govet      — shadowing, nilness, unreachable code, lock copies
#   * staticcheck (SA1*–SA6*) — correctness, dead code
#   * ineffassign — assigned-but-never-read
#   * unused     — dead funcs/vars/types
#   * bodyclose  — leaked http.Response.Body
#   * noctx      — http.NewRequest without ctx
#   * errorlint  — errors.Is/As correctness, %w usage
#
# What's deliberately OFF:
#   * errcheck    — too noisy on intentional Close() ignores; we'd need
#                   //nolint:errcheck on every defer Close pair
#   * copyloopvar — pre-1.22 idiom; no longer applicable but the
#                   leftover `i := i` lines are harmless
#   * gci/gofmt/gofumpt — formatting; not CI's job
#   * gosec       — high false-positive rate (flagged WithLease,
#                   WithCountOnly, etc. for "hardcoded credentials")
#   * rowserrcheck / sqlclosecheck — no SQL in this codebase

version: "2"

run:
  timeout: 8m
  go: "1.25"
  tests: true

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - ineffassign
    - unused
    - bodyclose
    - errorlint
  settings:
    govet:
      # `shadow` flags every `if err := ...; err != nil {` pattern
      # nested inside a func that already has an `err` in scope. That's
      # idiomatic Go (gopls / vet's default OFF for the same reason).
      # We keep `nilness` — it catches real "deref of nil after type
      # assertion" / "tautological condition" bugs that vet's defaults
      # miss. `noctx` is dropped here too: 4 call sites without ctx
      # exist (oauth callbacks, healthcheck pings, alert webhook
      # POSTs) where threading a request context buys nothing — those
      # are short-lived and supervisor-owned.
      enable:
        - nilness
    staticcheck:
      # SA1*-SA6* covers correctness + dead code without the heavy
      # SA9xxx style analyses. ST and QF are style/suggestions
      # already covered by formatters run locally.
      checks:
        - "SA1*"
        - "SA2*"
        - "SA3*"
        - "SA4*"
        - "SA5*"
        - "SA6*"
  exclusions:
    paths:
      - internal/k8sdecode/testseed
      - scripts/screenshots
    rules:
      - path: _test\.go
        linters:
          - bodyclose
      - path: internal/audit/audit\.go
        text: "Error return value of `\\(\\*encoding/json.Encoder\\).Encode` is not checked"
      # v2 transport pre-dates Go 1.6 contexts; the CancelRequest hook
      # is intentionally there for legacy etcd v2 client cancellation.
      # Migrating to Request.WithContext requires reshaping the v2
      # client wrapper API — separate cleanup.
      - path: internal/etcdpool/v2_transport\.go
        text: "SA1019.*CancelRequest"
